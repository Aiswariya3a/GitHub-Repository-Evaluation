{% extends "base.html" %}{% block content %}<header class="page-heading"><div><p class="eyebrow">Portfolio intelligence</p><h1>Analytics</h1><p class="hero-copy">Cross-session evaluation coverage and project-health trends.</p></div></header><section class="stats-grid dashboard-kpis" id="analyticsStats"></section><section class="panel"><div class="panel-header"><h2>Session completion</h2></div><div id="completionAnalytics" class="distribution"></div></section><script>Promise.all([fetch('/api/dashboard').then(r=>r.json()),fetch('/api/sessions').then(r=>r.json())]).then(([d,s])=>{const m=d.metrics;analyticsStats.innerHTML=`<article class="metric-card"><p class="metric-label">Analyzed</p><p class="metric-value">${m.evaluated_count}</p></article><article class="metric-card"><p class="metric-label">Average health</p><p class="metric-value">${Number(m.average_health||0).toFixed(1)}/20</p></article><article class="metric-card"><p class="metric-label">Running</p><p class="metric-value">${m.running_count}</p></article>`;completionAnalytics.innerHTML=s.map(x=>{const pct=x.repository_count?Math.round(x.evaluated_count/x.repository_count*100):0;return `<div><span>${x.name}</span><div class="distribution-bar"><i style="width:${pct}%"></i></div><strong>${pct}%</strong></div>`}).join('')||'<p class="empty-state">No sessions available.</p>'})</script>{% endblock %}
