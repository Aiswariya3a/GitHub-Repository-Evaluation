<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }} · Repository Evaluation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <nav class="topbar"><a class="brand" href="{{ url_for('session.dashboard') }}"><span>RE</span> Repository Evaluation</a><a href="{{ url_for('session.dashboard') }}">Sessions</a></nav>
  <main class="app-shell">
    {% with messages = get_flashed_messages() %}{% if messages %}<ul class="flash-list">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
