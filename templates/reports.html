{% extends "base.html" %}{% block content %}<header class="page-heading modern-heading"><div><p class="eyebrow">Stored results</p><h1>Reports</h1><p class="hero-copy">Generate polished reports on demand from PostgreSQL records.</p></div></header><section class="stats-grid dashboard-kpis"><article class="metric-card modern-kpi violet"><p class="metric-label">Report source</p><p class="metric-value small-value">PostgreSQL</p><span class="metric-caption">Always current</span></article><article class="metric-card modern-kpi green"><p class="metric-label">Format</p><p class="metric-value small-value">PDF</p><span class="metric-caption">Session and repository</span></article></section><section class="panel"><div class="panel-header"><div><p class="eyebrow">Report library</p><h2>Session reports</h2></div><div class="search-field"><span>⌕</span><input id="reportSearch" placeholder="Search reports…"></div></div><div id="reportSessions" class="activity-list"><div class="skeleton-row"></div><div class="skeleton-row"></div></div></section><script>let reports=[];const draw=()=>{const q=reportSearch.value.toLowerCase();reportSessions.innerHTML=reports.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<div class="activity-item"><span class="activity-avatar">PDF</span><div><strong>${x.name}</strong><span>${x.evaluated_count}/${x.repository_count} repositories evaluated · Updated ${new Date(x.updated_at).toLocaleDateString()}</span></div><div class="dropdown"><button class="table-btn" onclick="this.nextElementSibling.classList.toggle('open')">Actions ▾</button><div class="dropdown-menu"><a href="/sessions/${x.id}/report">Download PDF</a><a href="/sessions/${x.id}">Open session</a></div></div></div>`).join('')||'<div class="polished-empty"><span>□</span><strong>No matching reports</strong><p>Completed evaluations will appear here.</p></div>'};fetch('/api/sessions').then(r=>r.json()).then(items=>{reports=items.filter(x=>Number(x.evaluated_count)>0);draw()});reportSearch.addEventListener('input',draw)</script>{% endblock %}
