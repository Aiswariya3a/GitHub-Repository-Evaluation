{% extends "base.html" %}{% block content %}<div id="repositoryPage" data-session-id="{{ session_id }}" data-repository-id="{{ repository_id }}">
<header class="page-heading modern-heading"><div><div class="breadcrumbs"><a id="sessionBack" href="#">Session</a><span>/</span><span>Repository</span></div><div class="title-row"><span class="repo-icon large">âŒ˜</span><div><h1 id="repositoryTitle">Loadingâ€¦</h1><p id="repositoryUrl" class="hero-copy"></p></div><span id="repositoryStatus" class="status-badge"></span></div></div><div id="repositoryActions" class="action-row"></div></header><div id="repositoryError" class="api-error" hidden></div>
<div class="repository-page-layout">
<main class="repository-content"><nav id="repositoryTabs" class="tab-bar"><button class="active" data-tab="overview">Overview</button><button data-tab="quality">Code quality</button><button data-tab="documentation">Documentation</button><button data-tab="collaboration">Collaboration</button><button data-tab="ingestion">Ingestion</button><button data-tab="evaluation">Evaluation Detail</button><button data-tab="activity">Activity</button><button data-tab="history">History</button></nav>
<section id="tab-overview" class="tab-panel active"><div id="overviewMetrics" class="stats-grid repository-kpis"></div><div class="repository-detail-grid"><article class="panel"><div class="panel-header"><div><p class="eyebrow">Score profile</p><h2>Evaluation dimensions</h2></div></div><div id="dimensionChart" class="radar-placeholder"></div></article><article class="panel"><div class="panel-header"><div><p class="eyebrow">Intelligence</p><h2>Key insights</h2></div></div><div id="keyInsights" class="insight-stack"></div></article></div><article class="panel recommendation-panel"><div class="panel-header"><div><p class="eyebrow">Next steps</p><h2>Recommendations</h2></div></div><div id="recommendations"></div></article></section>
<section id="tab-quality" class="tab-panel"><div id="qualityContent" class="metric-card-list"></div></section><section id="tab-documentation" class="tab-panel"><div id="documentationContent" class="metric-card-list"></div></section><section id="tab-collaboration" class="tab-panel"><div id="collaborationContent"></div></section><section id="tab-activity" class="tab-panel"><div id="activityContent" class="three-columns"></div></section><section id="tab-history" class="tab-panel"><div id="historyContent" class="timeline panel"></div></section><section id="tab-ingestion" class="tab-panel"><div class="panel"><div class="panel-header"><div><p class="eyebrow">Source code</p><h2>File tree &amp; analysis</h2></div></div><div id="ingestionContent" class="ingestion-content"><div class="skeleton-block" style="height:120px"></div></div></div></section><section id="tab-evaluation" class="tab-panel"><div class="panel"><div class="panel-header"><div><p class="eyebrow">Per-criterion results</p><h2>Evaluation breakdown</h2></div></div><div id="evaluationContent" class="metric-card-list"><div class="skeleton-block" style="height:200px"></div></div></div></section></main></div></div>
<script src="{{ url_for('static', filename='js/repository.js') }}"></script>{% endblock %}
