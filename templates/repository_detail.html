{% extends "base.html" %}{% block content %}<div id="repositoryPage" data-session-id="{{ session_id }}" data-repository-id="{{ repository_id }}">
<header class="page-heading modern-heading"><div><div class="breadcrumbs"><a id="sessionBack" href="#">Session</a><span>/</span><span>Repository</span></div><div class="title-row"><span id="repoAvatar" class="repo-icon large"></span><div><h1 id="repositoryTitle">Loadingâ€¦</h1><p id="repositoryUrl" class="hero-copy"></p></div><span id="repositoryStatus" class="status-badge"></span></div></div><div id="repositoryActions" class="action-row"></div></header><div id="repositoryError" class="api-error" hidden></div>
<div class="repository-page-layout">
<main class="repository-content"><nav id="repositoryTabs" class="tab-bar"><button class="active" data-tab="overview">Overview</button><button data-tab="evaluation">Evaluation Detail</button><button data-tab="quality">Code quality</button><button data-tab="collaboration">Collaboration</button><button data-tab="ingestion">Ingestion</button></nav>
<section id="tab-overview" class="tab-panel active"><div id="overviewContent"></div></section>
<section id="tab-evaluation" class="tab-panel"><div class="panel"><div class="panel-header"><div><p class="eyebrow">Per-criterion results</p><h2>Evaluation breakdown</h2></div></div><div id="evaluationContent" class="metric-card-list"><div class="skeleton-block" style="height:200px"></div></div></div></section><section id="tab-quality" class="tab-panel"><div id="qualityContent" class="metric-card-list"></div></section><section id="tab-collaboration" class="tab-panel"><div id="collaborationContent"></div></section><section id="tab-ingestion" class="tab-panel"><div class="panel"><div class="panel-header"><div><p class="eyebrow">Source code</p><h2>File tree &amp; analysis</h2></div></div><div id="ingestionContent" class="ingestion-content"><div class="skeleton-block" style="height:120px"></div></div></div></section></main></div></div>
<script src="{{ url_for('static', filename='js/repository.js') }}"></script>{% endblock %}
