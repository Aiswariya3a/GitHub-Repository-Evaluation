{% extends "base.html" %}{% block content %}<div id="repositoryPage" data-session-id="{{ session_id }}" data-repository-id="{{ repository_id }}">
<header class="page-heading modern-heading"><div><div class="breadcrumbs"><a id="sessionBack" href="#">Session</a><span>/</span><span>Repository</span></div><div class="title-row"><span class="repo-icon large">⌘</span><div><h1 id="repositoryTitle">Loading…</h1><p id="repositoryUrl" class="hero-copy"></p></div><span id="repositoryStatus" class="status-badge"></span></div></div><div id="repositoryActions" class="action-row"></div></header><div id="repositoryError" class="api-error" hidden></div>
<div class="repository-page-layout"><aside class="score-sidebar"><article class="panel sticky-score"><p class="eyebrow">Overall health</p><div id="repositoryGauge" class="repository-gauge skeleton-block"></div><div id="scoreMeta" class="score-meta"></div><div class="sidebar-actions"><button id="evaluateButton" class="primary-btn">Evaluate</button><a id="reportButton" class="secondary-btn">Download report</a></div></article></aside>
<main class="repository-content"><nav id="repositoryTabs" class="tab-bar"><button class="active" data-tab="overview">Overview</button><button data-tab="quality">Code quality</button><button data-tab="documentation">Documentation</button><button data-tab="collaboration">Collaboration</button><button data-tab="activity">Activity</button><button data-tab="history">History</button></nav>
<section id="tab-overview" class="tab-panel active"><div id="overviewMetrics" class="stats-grid repository-kpis"></div><div class="repository-detail-grid"><article class="panel"><div class="panel-header"><div><p class="eyebrow">Score profile</p><h2>Evaluation dimensions</h2></div></div><div id="dimensionChart" class="radar-placeholder"></div></article><article class="panel"><div class="panel-header"><div><p class="eyebrow">Intelligence</p><h2>Key insights</h2></div></div><div id="keyInsights" class="insight-stack"></div></article></div><article class="panel recommendation-panel"><div class="panel-header"><div><p class="eyebrow">Next steps</p><h2>Recommendations</h2></div></div><div id="recommendations"></div></article></section>
<section id="tab-quality" class="tab-panel"><div id="qualityContent" class="metric-card-list"></div></section><section id="tab-documentation" class="tab-panel"><div id="documentationContent" class="metric-card-list"></div></section><section id="tab-collaboration" class="tab-panel"><div id="collaborationContent" class="metric-card-list"></div></section><section id="tab-activity" class="tab-panel"><div id="activityContent" class="three-columns"></div></section><section id="tab-history" class="tab-panel"><div id="historyContent" class="timeline panel"></div></section></main></div></div>
<script>
const page=repositoryPage,sid=page.dataset.sessionId,rid=page.dataset.repositoryId,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let repository=null;const empty=(title,text)=>`<div class="polished-empty"><span>◇</span><strong>${title}</strong><p>${text}</p></div>`,metricList=(items,kind)=>items.length?items.map(x=>`<article class="insight-metric"><div><span class="metric-orb"></span><strong>${esc(x.metric||x.name||x.title||'Metric')}</strong></div><p>${esc(x.value||x.remarks||x.state||'Recorded')}</p>${x.score!=null?`<div class="progress-bar"><span style="width:${Math.min(100,Number(x.score)*10)}%"></span></div>`:''}</article>`).join(''):empty(`No ${kind} insights`,`This area will populate when ${kind} analysis is available.`);
function render(d){repository=d.repository;const r=repository,i=r.insights,e=r.evaluation_data.evaluation||{},f=e.final||{},score=Number(f.normalized_to_20||0),questions=e.questions||{};sessionBack.href=`/sessions/${sid}`;repositoryTitle.textContent=r.roll_number+' · '+r.repo_url.split('/').pop();repositoryUrl.textContent=r.repo_url;repositoryStatus.textContent=r.status;repositoryStatus.className='status-badge status-'+r.status.toLowerCase();repositoryActions.innerHTML=`<a class="secondary-btn" href="${r.repo_url}" target="_blank">Open GitHub ↗</a><div class="dropdown"><button class="secondary-btn" onclick="this.nextElementSibling.classList.toggle('open')">Actions ▾</button><div class="dropdown-menu"><button onclick="runEvaluation(true)">Re-evaluate</button><a href="/sessions/${sid}/repositories/${rid}/report">Download report</a></div></div>`;repositoryGauge.innerHTML=`<div class="gauge-ring compact-gauge" style="--score:${score/20*360}deg"><div><strong>${score.toFixed(1)}</strong><span>out of 20</span></div></div><span class="health-label">${score>=16?'Strong':score>=12?'On track':score>=8?'Needs review':'Needs attention'}</span>`;scoreMeta.innerHTML=`<div><span>Evaluated</span><strong>${r.evaluated_at?new Date(r.evaluated_at).toLocaleDateString():'Never'}</strong></div><div><span>Total marks</span><strong>${Number(f.total_out_of_80||0).toFixed(1)}/80</strong></div><div><span>Commits</span><strong>${r.commit_count||0}</strong></div>`;evaluateButton.textContent=r.status==='Completed'?'Re-evaluate':'Evaluate';evaluateButton.onclick=()=>runEvaluation(r.status==='Completed');reportButton.hidden=r.status!=='Completed';reportButton.href=`/sessions/${sid}/repositories/${rid}/report`;overviewMetrics.innerHTML=`<article class="metric-card"><p class="metric-label">Public access</p><p class="metric-value small-value">${r.is_public?'Public':'Unavailable'}</p></article><article class="metric-card"><p class="metric-label">README</p><p class="metric-value small-value">${r.readme_exists?'Present':'Missing'}</p></article><article class="metric-card"><p class="metric-label">Commits</p><p class="metric-value">${r.commit_count||0}</p></article>`;const dims=Object.entries(questions).slice(0,10);dimensionChart.innerHTML=dims.length?dims.map(([k,v])=>`<div><span>${k}</span><div class="distribution-bar"><i style="width:${Number(v.total||0)/8*100}%"></i></div><strong>${Number(v.total||0).toFixed(1)}</strong></div>`).join(''):empty('No score dimensions','Run an evaluation to generate rubric scores.');const warnings=[];if(!r.readme_exists)warnings.push(['warning','README missing','Add clear setup and usage documentation.']);if(!r.is_public)warnings.push(['danger','Repository unavailable','Confirm repository visibility and URL access.']);if(score<12)warnings.push(['warning','Health below target','Review low-scoring rubric dimensions.']);if(!warnings.length)warnings.push(['success','Healthy repository','No critical warnings detected.']);keyInsights.innerHTML=warnings.map(([tone,title,text])=>`<div class="insight-alert ${tone}"><span>${tone==='success'?'✓':'!'}</span><div><strong>${title}</strong><p>${text}</p></div></div>`).join('');recommendations.innerHTML=f.overall_remarks?`<div class="recommendation"><span>01</span><p>${esc(f.overall_remarks)}</p></div>`:empty('No recommendations yet','Recommendations are generated from saved evaluation results.');qualityContent.innerHTML=metricList(i.code_quality,'code quality');documentationContent.innerHTML=metricList(i.documentation,'documentation');collaborationContent.innerHTML=metricList(i.collaboration,'collaboration');activityContent.innerHTML=`<article class="panel"><h2>Commits</h2>${metricList(i.commits,'commit')}</article><article class="panel"><h2>Issues</h2>${metricList(i.issues,'issue')}</article><article class="panel"><h2>Pull requests</h2>${metricList(i.pull_requests,'pull request')}</article>`;historyContent.innerHTML=[['Repository added',r.created_at],['Last updated',r.updated_at],['Last evaluated',r.evaluated_at]].map(([name,at])=>`<div class="history-event"><span class="timeline-dot"></span><div><strong>${name}</strong><small>${at?new Date(at).toLocaleString():'Not yet'}</small></div></div>`).join('')}
async function load(){try{const response=await fetch(`/api/sessions/${sid}/repositories/${rid}`),d=await response.json();if(!response.ok)throw Error(d.error);render(d)}catch(e){repositoryError.hidden=false;repositoryError.textContent=e.message}}async function runEvaluation(re){if(!await confirmAction(`${re?'Re-evaluate':'Evaluate'} this repository?`,'Repository evaluation'))return;toast('Evaluation started');const response=await fetch(`/api/sessions/${sid}/repositories/${rid}/${re?'reevaluate':'evaluate'}`,{method:'POST'}),d=await response.json();if(!response.ok)toast(d.error,'error');else toast('Evaluation completed');load()}repositoryTabs.addEventListener('click',e=>{if(!e.target.dataset.tab)return;repositoryTabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===e.target));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.toggle('active',x.id==='tab-'+e.target.dataset.tab))});load();
</script>{% endblock %}
