{% extends "base.html" %}{% block content %}<div id="rubricPage" data-version-id="{{ version_id }}"><header class="page-heading modern-heading"><div><div class="breadcrumbs"><a href="/rubrics">Rubrics</a><span>/</span><span>Template</span></div><div class="title-row"><div id="rubricNameContainer"></div><span id="rubricType" class="status-badge"></span><span id="rubricVersion" class="count-pill"></span></div><div id="rubricDescriptionContainer"></div></div><div id="rubricActions" class="action-row"></div></header><div class="stats-grid session-stats" id="rubricStats"></div><section class="panel"><div class="panel-header"><div><p class="eyebrow">Scoring structure</p><h2>Categories and criteria</h2></div><button id="addCategory" class="secondary-btn" onclick="addCategory()" hidden>+ Category</button></div><div id="categoryList" class="rubric-category-list"><div class="skeleton-row"></div></div><div id="editorActions" class="dialog-actions" hidden><button class="secondary-btn" onclick="loadRubric()">Discard</button><button class="primary-btn" onclick="saveRubric()">Save new version</button></div></section></div>
<script>const versionId=rubricPage.dataset.versionId,editRequested=new URLSearchParams(location.search).has('edit');let rubric=null,editing=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderHeader(){rubricNameContainer.innerHTML=editing&&!rubric.is_read_only?`<input id="rubricNameInput" class="rubric-text-input" value="${esc(rubric.name)}" placeholder="Rubric name">`:`<h1 id="rubricName">${esc(rubric.name)}</h1>`;rubricDescriptionContainer.innerHTML=editing&&!rubric.is_read_only?`<textarea id="rubricDescriptionInput" class="rubric-textarea" rows="3" placeholder="Description">${esc(rubric.description||'')}</textarea>`:`<p id="rubricDescription" class="hero-copy">${esc(rubric.description||'No description')}</p>`}function draw(){renderHeader();rubricType.textContent=rubric.rubric_type+(rubric.is_default?' · Default':'');rubricType.className='status-badge '+(rubric.rubric_type==='System'?'session-completed':'session-active');rubricVersion.textContent='v'+rubric.version;rubricStats.innerHTML=`<article class="metric-card"><p class="metric-label">Categories</p><p class="metric-value">${rubric.categories.length}</p></article><article class="metric-card"><p class="metric-label">Criteria</p><p class="metric-value">${rubric.categories.reduce((n,x)=>n+x.criteria.length,0)}</p></article><article class="metric-card"><p class="metric-label">Maximum score</p><p class="metric-value">${rubric.total_score}</p></article><article class="metric-card"><p class="metric-label">Access</p><p class="metric-value small-value">${rubric.is_read_only?'Read-only':'Editable'}</p></article>`;rubricActions.innerHTML=`<button class="secondary-btn" onclick="duplicateCurrent()">Duplicate rubric</button>${!rubric.is_read_only?'<button class="primary-btn" onclick="setEditing(true)">Edit rubric</button>':''}`;renderCategories();if(editRequested&&!rubric.is_read_only)setEditing(true)}function renderCategories(){categoryList.innerHTML=rubric.categories.map((c,ci)=>`<article class="rubric-category"><div class="rubric-category-head"><div><span class="category-code">${editing&&!rubric.is_read_only?`<input value="${esc(c.code)}" data-field="code">`:esc(c.code)}</span>${editing&&!rubric.is_read_only?`<input value="${esc(c.name)}" data-field="name" class="rubric-category-name">`:`<h3>${esc(c.name)}</h3>`}</div><div class="row-actions"><strong>${Number(c.max_score)} pts</strong>${editing&&!rubric.is_read_only?`<button type="button" class="icon-btn" onclick="removeCategory(this.closest('.rubric-category'))">×</button>`:''}</div></div><div class="criteria-list">${c.criteria.map((x,xi)=>`<div class="criterion-row"><span>${editing&&!rubric.is_read_only?`<input value="${esc(x.name)}" data-field="criterion-name">`:esc(x.name)}</span><span class="criterion-key">${esc(x.criterion_key)}</span>${editing&&!rubric.is_read_only?`<input type="number" min="0" step=".5" value="${Number(x.max_score)}" data-field="score"><button type="button" class="icon-btn" onclick="removeCriterion(this.closest('.criterion-row'))">×</button>`:`<strong>${Number(x.max_score)}</strong>`}</div>`).join('')}</div>${editing&&!rubric.is_read_only?`<button type="button" class="table-btn" onclick="addCriterion(this.closest('.rubric-category'))">+ Add criterion</button>`:''}</article>`).join('')}function setEditing(value){editing=value;addCategory.hidden=!value;editorActions.hidden=!value;renderCategories();renderHeader()}function addCategory(){if(!editing||rubric.is_read_only)return;rubric.categories.push({code:`C${rubric.categories.length+1}`,name:'New category',criteria:[{criterion_key:'new_criterion',name:'New criterion',max_score:5}]});renderCategories()}function addCriterion(card){const list=card.querySelector('.criteria-list');list.insertAdjacentHTML('beforeend',`<div class="criterion-row"><span><input value="New criterion" data-field="criterion-name"></span><span class="criterion-key">new_criterion</span><input type="number" min="0" step=".5" value="5" data-field="score"><button type="button" class="icon-btn" onclick="removeCriterion(this.closest('.criterion-row'))">×</button></div>`)}function removeCategory(card){card.remove()}function removeCriterion(row){row.remove()}async function loadRubric(){rubric=(await fetch(`/api/rubrics/versions/${versionId}`).then(r=>r.json())).rubric;editing=false;draw()}async function duplicateCurrent(){const r=await fetch(`/api/rubrics/versions/${versionId}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rubric.name+' Copy'})}),d=await r.json();if(r.ok){toast('Rubric duplicated');location.href='/rubrics/'+d.version_id+'?edit=1'}}async function saveRubric(){const cards=[...categoryList.querySelectorAll('.rubric-category')],categories=cards.map((card,ci)=>({code:card.querySelector('[data-field=code]').value,name:card.querySelector('[data-field=name]').value,criteria:[...card.querySelectorAll('.criterion-row')].map((row,xi)=>({key:rubric.categories[ci].criteria[xi]?rubric.categories[ci].criteria[xi].criterion_key:row.querySelector('.criterion-key').textContent.trim(),name:row.querySelector('[data-field=criterion-name]').value,max_score:Number(row.querySelector('[data-field=score]').value)}))}));const nextName=(document.getElementById('rubricNameInput')?.value||'').trim()||rubric.name;const nextDescription=document.getElementById('rubricDescriptionInput')?.value||rubric.description||'';const r=await fetch(`/api/rubrics/${rubric.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nextName,description:nextDescription,categories})}),d=await r.json();if(!r.ok)return toast(d.error,'error');toast('New rubric version saved');location.href='/rubrics/'+d.version_id}loadRubric()</script>{% endblock %}
