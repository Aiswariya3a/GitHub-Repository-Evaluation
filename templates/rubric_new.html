{% extends "base.html" %}{% block content %}<header class="page-heading modern-heading"><div><div class="breadcrumbs"><a href="/rubrics">Rubrics</a><span>/</span><span>New</span></div><h1>Create custom rubric</h1><p class="hero-copy">Build a reusable scoring template from scratch.</p></div></header><form id="rubricForm"><section class="panel input-form"><label>Rubric name</label><input id="name" required placeholder="Python Mini Project"><label>Description</label><textarea id="description" rows="3" placeholder="What this rubric evaluates"></textarea></section><div class="workspace-heading rubric-builder-heading"><h2>Categories and criteria</h2><button type="button" class="secondary-btn" onclick="addCategory()">+ Add category</button></div><div id="builder"></div><div class="dialog-actions"><a href="/rubrics" class="secondary-btn">Cancel</a><button class="primary-btn">Create rubric</button></div></form><script>let categoryNumber=0;function addCategory(){categoryNumber++;const el=document.createElement('article');el.className='panel rubric-builder';el.innerHTML=`<div class="rubric-category-head"><input class="category-code-input" value="C${categoryNumber}" required><input class="category-name-input" placeholder="Category name" required><button type="button" class="danger-btn" onclick="this.closest('article').remove()">Remove</button></div><div class="builder-criteria"></div><button type="button" class="table-btn" onclick="addCriterion(this.previousElementSibling)">+ Add criterion</button>`;builder.appendChild(el);addCriterion(el.querySelector('.builder-criteria'))}function addCriterion(container){const row=document.createElement('div');row.className='criterion-builder-row';row.innerHTML=`<input class="criterion-key-input" placeholder="criterion_key" required><input class="criterion-name-input" placeholder="Criterion name" required><input class="criterion-score-input" type="number" min="0.5" step="0.5" value="5" required><button type="button" class="icon-btn" onclick="this.parentElement.remove()">×</button>`;container.appendChild(row)}rubricForm.onsubmit=async e=>{e.preventDefault();const categories=[...builder.querySelectorAll('.rubric-builder')].map(card=>({code:card.querySelector('.category-code-input').value,name:card.querySelector('.category-name-input').value,criteria:[...card.querySelectorAll('.criterion-builder-row')].map(row=>({key:row.querySelector('.criterion-key-input').value,name:row.querySelector('.criterion-name-input').value,max_score:Number(row.querySelector('.criterion-score-input').value)}))}));const r=await fetch('/api/rubrics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,description:description.value,categories})}),d=await r.json();if(!r.ok)return toast(d.error,'error');toast('Rubric created');location.href='/rubrics/'+d.version_id};addCategory()</script>{% endblock %}
