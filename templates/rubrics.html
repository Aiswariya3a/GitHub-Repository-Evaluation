{% extends "base.html" %}{% block content %}<header class="page-heading modern-heading"><div><p class="eyebrow">Evaluation design</p><h1>Rubric templates</h1><p class="hero-copy">Reusable, versioned scoring frameworks for every evaluation session.</p></div><button class="primary-btn" onclick="location.href='/rubrics/new'">+ Create rubric</button></header><section class="session-group"><div class="section-title"><span class="status-dot completed-dot"></span><h2>System Rubrics</h2></div><div id="systemRubrics" class="session-card-grid"><div class="skeleton-card"></div></div></section><section class="session-group rubric-section"><div class="section-title"><span class="status-dot active-dot"></span><h2>Custom Rubrics</h2></div><div id="customRubrics" class="session-card-grid"><div class="skeleton-card"></div></div></section>
<dialog id="duplicateDialog" class="app-dialog"><form id="duplicateForm" class="input-form"><h2>Duplicate rubric</h2><p class="settings-copy">Creates an editable custom copy while preserving the source version.</p><input id="duplicateName" required><input id="duplicateVersion" type="hidden"><div class="dialog-actions"><button type="button" class="secondary-btn" onclick="duplicateDialog.close()">Cancel</button><button class="primary-btn">Create copy</button></div></form></dialog>
<script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function rubricCard(r){return `<article class="session-card new-session-card rubric-card"><div class="card-top"><span class="status-badge ${r.rubric_type==='System'?'session-completed':'session-active'}">${r.rubric_type}</span>${r.is_default?'<span class="default-label">Default</span>':''}</div><h3>${esc(r.name)}</h3><p>${esc(r.description||'No description')}</p><div class="rubric-counts"><span><strong>${r.category_count}</strong> categories</span><span><strong>${r.criterion_count}</strong> criteria</span><span><strong>v${r.version}</strong> version</span></div><div class="card-footer"><span>Updated ${new Date(r.updated_at).toLocaleDateString()}</span><div class="row-actions"><a class="table-btn" href="/rubrics/${r.version_id}">View</a><button class="table-btn" onclick="duplicateRubric('${r.version_id}','${esc(r.name)}')">Duplicate</button>${!r.is_read_only?`<a class="table-btn" href="/rubrics/${r.version_id}?edit=1">Edit</a><button class="table-btn" onclick="archiveRubric('${r.id}')">Archive</button><button class="table-btn danger-text" onclick="deleteRubric('${r.id}')">Delete</button>`:''}</div></div></article>`}async function load(){const items=await fetch('/api/rubrics').then(r=>r.json());systemRubrics.innerHTML=items.filter(x=>x.rubric_type==='System').map(rubricCard).join('');customRubrics.innerHTML=items.filter(x=>x.rubric_type==='Custom').map(rubricCard).join('')||'<div class="polished-empty"><span>＋</span><strong>No custom rubrics</strong><p>Duplicate the system rubric or create one from scratch.</p></div>'}function duplicateRubric(id,name){duplicateVersion.value=id;duplicateName.value=name+' Copy';duplicateDialog.showModal()}duplicateForm.onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/rubrics/versions/${duplicateVersion.value}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:duplicateName.value})}),d=await r.json();if(!r.ok)return toast(d.error,'error');duplicateDialog.close();toast('Editable rubric copy created');location.href='/rubrics/'+d.version_id+'?edit=1'};async function archiveRubric(id){if(!await confirmAction('Archive this custom rubric?'))return;const r=await fetch(`/api/rubrics/${id}/archive`,{method:'POST'});if(r.ok){toast('Rubric archived');load()}}async function deleteRubric(id){if(!await confirmAction('Permanently delete this custom rubric? Existing assigned versions may prevent deletion.','Delete rubric'))return;const r=await fetch(`/api/rubrics/${id}`,{method:'DELETE'});if(r.ok){toast('Rubric deleted');load()}else toast((await r.json()).error,'error')}load()</script>{% endblock %}
