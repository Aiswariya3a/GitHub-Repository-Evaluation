{% extends "base.html" %}{% block content %}
<header class="page-heading"><div><p class="eyebrow">System</p><h1>Administration</h1><p class="hero-copy">Platform health, configuration, and operational statistics for the evaluation workspace.</p></div><button class="secondary-btn" onclick="refreshStatus()" style="flex:none;padding:9px 16px;font-size:.8rem">Refresh</button></header>

<section class="admin-grid" id="adminApp">
  <div class="admin-health-grid" id="healthCards">
    <article class="admin-card skeleton-card"><div class="admin-card-icon"></div><div class="admin-card-value skeleton-line"></div><div class="admin-card-label skeleton-line short"></div></article>
    <article class="admin-card skeleton-card"><div class="admin-card-icon"></div><div class="admin-card-value skeleton-line"></div><div class="admin-card-label skeleton-line short"></div></article>
    <article class="admin-card skeleton-card"><div class="admin-card-icon"></div><div class="admin-card-value skeleton-line"></div><div class="admin-card-label skeleton-line short"></div></article>
    <article class="admin-card skeleton-card"><div class="admin-card-icon"></div><div class="admin-card-value skeleton-line"></div><div class="admin-card-label skeleton-line short"></div></article>
  </div>

  <div class="admin-two-col">
    <article class="panel">
      <div class="panel-header bordered"><h2>Database Tables</h2><span class="admin-badge" id="dbStatusBadge">Checking...</span></div>
      <div class="admin-table-wrap" id="dbTableBody"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    </article>
    <article class="panel">
      <div class="panel-header bordered"><h2>Configuration</h2><span class="admin-badge">Read-only</span></div>
      <div class="admin-config-list" id="configBody"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    </article>
  </div>

  <article class="panel">
    <div class="panel-header bordered"><h2>Runtime</h2><span class="admin-badge">Server info</span></div>
    <div class="admin-runtime" id="runtimeBody"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
  </article>
</section>

<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
